---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/users/create":
    post:
      summary: Creates a user
      tags:
      - Users
      parameters: []
      responses:
        '201':
          description: user created
        '422':
          description: password confirmation mismatch
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
                currency:
                  type: string
              required:
              - first_name
              - last_name
              - email
              - password
              - password_confirmation
              - currency
  "/api/v1/users/login":
    post:
      summary: Logs a user in
      tags:
      - Users
      parameters: []
      responses:
        '200':
          description: logged in
        '401':
          description: unknown email
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/api/v1/users/me":
    get:
      summary: Returns the current user
      tags:
      - Users
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: current user
        '401':
          description: expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: object
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
